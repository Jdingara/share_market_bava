<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lalitha Bot</title>
<style>
  :root { --bg: #f4f5f7; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #d9dde3; --up: #137333; --down: #c5221f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e6e8eb; --muted: #9aa3ad; --line: #2c333b; --up: #4caf6a; --down: #ef6b5e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; overflow-x: auto; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .big { font-size: 18px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .up { color: var(--up); } .down { color: var(--down); }
  .log { font: 12px ui-monospace, monospace; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Lalitha #4 <span id="market"></span> <span class="muted" id="mode"></span></h1>
<div class="muted">PAPER MODE · 5-min index · Supertrend(10,2) + RSI(14) 70/30 + Pivot R1/S1 + Bollinger(20,3) close → premium ≈ 250 · exit on Supertrend flip</div>
<div class="card row">
  <div><div class="muted">Pivot / R1 / S1</div><div class="big" id="piv">–</div></div>
  <div><div class="muted">Close</div><div class="big" id="close">–</div></div>
  <div><div class="muted">Supertrend</div><div class="big" id="st">–</div></div>
  <div><div class="muted">RSI</div><div class="big" id="rsi">–</div></div>
  <div><div class="muted">Bollinger L / U</div><div class="big" id="bb">–</div></div>
  <div><div class="muted">P&amp;L ₹</div><div class="big" id="pnl">0</div></div>
</div>
<div class="card"><div class="muted" id="status">–</div></div>
<div class="card"><table><thead><tr><th>Buy</th><th>Entry</th><th>Fill</th><th>Index</th><th>Exit</th><th>Reason</th><th>Pts</th><th>₹</th></tr></thead><tbody id="trades"></tbody></table></div>
<div class="card"><div class="muted">Log</div><div class="log" id="log"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (x) => (x >= 0 ? "+" : "") + Number(x).toLocaleString("en-IN", { maximumFractionDigits: 0 });
async function tick() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    $("market").textContent = s.market; $("mode").textContent = `${s.mode} · ${s.day} · qty ${s.qty} · expiry ${s.expiry || "-"}`;
    if (s.pivot) $("piv").textContent = `${s.pivot.P} / ${s.pivot.R1} / ${s.pivot.S1}`;
    const i = s.indicators;
    if (i) {
      $("close").textContent = i.close;
      $("st").textContent = i.supertrend ? `${i.supertrend} ${i.direction === 1 ? "▲" : "▼"}` : "–";
      $("st").className = "big " + (i.direction === 1 ? "up" : "down");
      $("rsi").textContent = i.rsi ?? "–";
      $("bb").textContent = i.bb ? `${i.bb[0]} / ${i.bb[2]}` : "–";
    }
    $("status").textContent = s.status;
    const total = s.trades.filter(t => t.exit_reason).reduce((a, t) => a + t.pnl_rupees, 0);
    $("pnl").textContent = fmt(total); $("pnl").className = "big " + (total >= 0 ? "up" : "down");
    $("trades").innerHTML = s.trades.map(t => `<tr><td>${t.qty} x ${t.strike} ${t.side}</td><td>${t.entry_time.slice(11,16)}</td>
      <td>${t.entry_fill}</td><td>${t.entry_index}</td>
      <td>${t.exit_reason ? t.exit_premium + " (" + t.exit_time.slice(11,16) + ")" : "open"}</td><td>${t.exit_reason || ""}</td>
      <td class="${t.pnl_points >= 0 ? "up" : "down"}">${t.exit_reason ? t.pnl_points.toFixed(2) : ""}</td>
      <td class="${t.pnl_points >= 0 ? "up" : "down"}">${t.exit_reason ? fmt(t.pnl_rupees) : ""}</td></tr>`).join("");
    $("log").textContent = s.log.slice(-60).map(l => `[${l.time}] ${l.text}`).join("\n");
  } catch (e) { $("status").textContent = "bot not reachable"; }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
